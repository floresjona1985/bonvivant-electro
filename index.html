<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bonvivant Electro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Orbitron:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070709; --gold:#f7ba00; --cream:#edeec7; --red:#e20000;
  --text:#f4f1e4; --muted:#9a9678; --line:rgba(247,186,0,.22);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:Outfit,system-ui,sans-serif;min-height:100%}
body{overflow-x:hidden}
.glow{text-shadow:0 0 8px rgba(247,186,0,.55),0 0 22px rgba(226,0,0,.2)}
button,input,select,textarea{font-family:inherit}
.bomb{width:46px;height:46px;flex:none;filter:drop-shadow(0 0 8px rgba(247,186,0,.45))}
.bomb.lg{width:92px;height:92px}

#gate{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(800px 400px at 50% -10%,rgba(247,186,0,.16),transparent 60%),
             radial-gradient(600px 400px at 80% 100%,rgba(226,0,0,.12),transparent 60%),var(--bg);
}
.gate-card{
  width:min(420px,100%);text-align:center;padding:36px 26px 30px;
  background:linear-gradient(180deg,#121214,#0b0b0d);
  border:1px solid var(--line);border-radius:22px;
  box-shadow:0 0 40px rgba(247,186,0,.12);
}
.gate-card h1{font-family:Orbitron,Outfit,sans-serif;letter-spacing:.1em;font-size:20px;margin:12px 0 2px;color:var(--gold)}
.gate-card .sub{color:var(--cream);letter-spacing:.28em;font-size:12px;margin-bottom:20px}
.gate-card input{
  width:100%;background:#09090c;border:1px solid var(--line);color:var(--cream);
  padding:14px 16px;border-radius:12px;font-size:16px;letter-spacing:.2em;text-align:center;
}
.gate-card input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(247,186,0,.15)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(90deg,var(--gold),#ffd24a);color:#161400;font-weight:800;
  border:0;border-radius:12px;padding:13px 18px;cursor:pointer;
}
.btn-full{width:100%;margin-top:14px}
.btn-ghost{background:transparent;color:var(--gold);border:1px solid var(--line)}
.err{color:#ff6b6b;min-height:18px;margin-top:10px;font-size:13px}

#app{display:none}
header{position:sticky;top:0;z-index:40;background:rgba(7,7,9,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 14px;max-width:1280px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;min-width:0}
.brand .txt strong{font-family:Orbitron,sans-serif;font-size:13px;letter-spacing:.08em;color:var(--gold);display:block;line-height:1.1}
.brand .txt span{font-size:11px;color:var(--cream);letter-spacing:.18em}
.search{flex:1;min-width:0;background:#0d0d12;border:1px solid var(--line);border-radius:999px;padding:10px 14px;color:var(--cream)}
.search:focus{outline:none;border-color:var(--gold)}
.icon-btn{position:relative;background:#121218;border:1px solid var(--line);color:var(--gold);width:42px;height:42px;border-radius:12px;cursor:pointer;font-size:18px;flex:none}
.badge{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:11px;font-weight:800;min-width:18px;height:18px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.hero{padding:22px 16px 4px;max-width:1280px;margin:0 auto}
.hero h2{font-size:clamp(26px,5vw,44px);line-height:1.08;color:var(--cream)}
.hero h2 em{font-style:normal;color:var(--gold)}
.hero p{color:var(--muted);margin-top:8px}
.cats{display:flex;gap:8px;overflow:auto;padding:14px 16px 8px;max-width:1280px;margin:0 auto;-webkit-overflow-scrolling:touch}
.chip{white-space:nowrap;border:1px solid var(--line);background:#101014;color:var(--cream);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:13px}
.chip.active{background:var(--gold);color:#161400;font-weight:700;border-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;padding:16px 16px 80px;max-width:1280px;margin:0 auto}
.card{background:linear-gradient(180deg,#14141a,#0e0e12);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.card .ph{height:168px;background:#0a0a0d;display:flex;align-items:center;justify-content:center}
.card img{max-width:100%;max-height:168px;object-fit:contain}
.card .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:7px;flex:1}
.card .cat{font-size:10px;letter-spacing:.12em;color:var(--gold);text-transform:uppercase}
.card h3{font-size:14px;font-weight:600;line-height:1.25;min-height:36px}
.card .price{color:var(--gold);font-weight:800;font-size:18px}
.card .code{font-size:11px;color:var(--muted)}
.note{width:100%;background:#09090c;border:1px solid var(--line);color:var(--cream);border-radius:10px;padding:8px 10px;font-size:13px;resize:none;min-height:58px}
.add{width:100%}
#drawer{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:50}
#drawer.open{display:block}
.panel{position:absolute;right:0;top:0;height:100%;width:min(420px,100%);background:#0c0c10;border-left:1px solid var(--line);padding:18px;overflow:auto}
.cart-item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.cart-item img{width:64px;height:64px;object-fit:contain;background:#09090c;border-radius:8px}
.obs{font-size:12px;color:#ffd24a;margin-top:4px}
.qty{display:flex;align-items:center;gap:8px;margin-top:6px}
.qty button{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:#15151b;color:var(--gold);cursor:pointer}
.total-row{display:flex;justify-content:space-between;font-size:18px;margin:16px 0;color:var(--gold);font-weight:800}
.form label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.form input,.form textarea{width:100%;background:#09090c;border:1px solid var(--line);color:var(--cream);padding:10px 12px;border-radius:10px}
.ok{background:#0f2a16;border:1px solid #1d6b38;color:#b6ffcf;padding:10px;border-radius:10px;margin-top:10px;display:none}
footer{padding:24px 16px 40px;text-align:center;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}
@media(max-width:640px){
  .search{position:absolute;left:14px;right:108px;top:62px}
  header{padding-bottom:52px}
}
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="bombita" viewBox="0 0 64 64">
    <path d="M40 16c7-9 16-9 18-3" fill="none" stroke="#e20000" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="58" cy="11" r="4.2" fill="#f7ba00"/>
    <circle cx="58" cy="11" r="2" fill="#edeec7"/>
    <rect x="25.5" y="14" width="9" height="8" rx="1.5" fill="#f7ba00"/>
    <circle cx="30" cy="40" r="18.5" fill="#f7ba00"/>
    <path d="M21 33c3-2 6-3 9-2" fill="none" stroke="#edeec7" stroke-width="2.2" stroke-linecap="round" opacity=".7"/>
  </symbol>
</svg>

<section id="gate">
  <div class="gate-card">
    <svg class="bomb lg"><use href="#bombita"></use></svg>
    <h1 class="glow">BONVIVANT</h1>
    <div class="sub">ELECTRO</div>
    <input id="pass" type="password" placeholder="CLAVE" autocomplete="off">
    <button class="btn btn-full" id="enterBtn">INGRESAR</button>
    <div class="err" id="gateErr"></div>
  </div>
</section>

<div id="app">
  <header>
    <div class="topbar">
      <a class="brand" href="#" onclick="resetCat();return false">
        <svg class="bomb"><use href="#bombita"></use></svg>
        <div class="txt">
          <strong class="glow">BONVIVANT</strong>
          <span>ELECTRO</span>
        </div>
      </a>
      <input class="search" id="q" placeholder="Buscar producto o código...">
      <button class="icon-btn" title="Mis datos" onclick="openDrawer('user')">👤</button>
      <button class="icon-btn" title="Carrito" onclick="openDrawer('cart')">🛒<span class="badge" id="badge">0</span></button>
    </div>
  </header>
  <div class="hero">
    <h2>Tecnología con onda <em>Bonvivant</em>.</h2>
    <p>Elegí productos, aclará color u observación y envianos el pedido.</p>
  </div>
  <div class="cats" id="cats"></div>
  <div class="grid" id="grid"></div>
  <footer>Bonvivant Electro · Pedidos al 11 2185-7252</footer>
</div>

<div id="drawer">
  <div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h3 id="drawerTitle" class="glow">Carrito</h3>
      <button class="icon-btn" onclick="closeDrawer()">✕</button>
    </div>
    <div id="cartView"></div>
    <div id="userView" style="display:none">
      <p style="color:var(--muted);font-size:13px;margin-bottom:8px">Estos datos viajan con tu pedido. Cada dispositivo tiene su propio carrito.</p>
      <div class="form">
        <label>Nombre y apellido</label>
        <input id="u_name">
        <label>WhatsApp</label>
        <input id="u_phone" placeholder="11 1234 5678">
        <label>Email</label>
        <input id="u_email">
        <label>Dirección / localidad</label>
        <textarea id="u_addr" rows="3"></textarea>
        <button class="btn btn-full" onclick="saveUser()">Guardar datos</button>
        <div class="ok" id="userOk">Datos guardados.</div>
      </div>
    </div>
  </div>
</div>

pg", "category": "AURICULARES"}];
const PASS = 'BV128';
const WA = '5491121857252';

function deviceId(){
  let id = localStorage.getItem('bv_device_id');
  if(!id){
    id = (crypto.randomUUID && crypto.randomUUID()) || ('d'+Date.now()+Math.random());
    localStorage.setItem('bv_device_id', id);
  }
  return id;
}
const CART_KEY = 'bv_cart_' + deviceId();
const USER_KEY = 'bv_user_' + deviceId();

let cart = JSON.parse(localStorage.getItem(CART_KEY) || '[]');
let user = JSON.parse(localStorage.getItem(USER_KEY) || '{}');
let cat = 'TODOS';

function money(n){ return '$' + Math.round(n).toLocaleString('es-AR'); }
function product(id){ return PRODUCTS.find(p=>p.id===id); }
function persistCart(){ localStorage.setItem(CART_KEY, JSON.stringify(cart)); }
function countCart(){ return cart.reduce((a,b)=>a+b.qty,0); }
function renderBadge(){ document.getElementById('badge').textContent = countCart(); }

document.getElementById('enterBtn').onclick = tryEnter;
document.getElementById('pass').addEventListener('keydown', e => { if(e.key==='Enter') tryEnter(); });
function tryEnter(){
  const v = (document.getElementById('pass').value||'').trim();
  if(v === PASS){ sessionStorage.setItem('bv_ok','1'); showApp(); }
  else document.getElementById('gateErr').textContent = 'Clave incorrecta';
}
function showApp(){
  document.getElementById('gate').style.display='none';
  document.getElementById('app').style.display='block';
  renderCats(); renderGrid(); renderBadge(); fillUser();
}
if(sessionStorage.getItem('bv_ok')==='1') showApp();

const cats = ['TODOS', ...Array.from(new Set(PRODUCTS.map(p=>p.category)))];
function renderCats(){
  document.getElementById('cats').innerHTML = cats.map(c =>
    `<button class="chip ${c===cat?'active':''}" onclick="setCat('${c}')">${c}</button>`
  ).join('');
}
function setCat(c){ cat=c; renderCats(); renderGrid(); }
function resetCat(){ setCat('TODOS'); document.getElementById('q').value=''; renderGrid(); }
document.getElementById('q').addEventListener('input', renderGrid);

function filtered(){
  const q = (document.getElementById('q').value||'').toLowerCase();
  return PRODUCTS.filter(p => {
    const okCat = cat==='TODOS' || p.category===cat;
    const okQ = !q || (p.name+' '+p.id+' '+p.category).toLowerCase().includes(q);
    return okCat && okQ;
  });
}
function esc(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderGrid(){
  const list = filtered();
  document.getElementById('grid').innerHTML = list.map(p => `
    <article class="card">
      <div class="ph"><img src="${p.img}" alt="${esc(p.name)}" onerror="this.style.opacity=.25"></div>
      <div class="body">
        <div class="cat">${esc(p.category)}</div>
        <h3>${esc(p.name)}</h3>
        <div class="code">${esc(p.id)}</div>
        <div class="price">${money(p.price)}</div>
        <textarea class="note" id="note-${esc(p.id)}" placeholder="Observaciones: color, modelo, aclaración..."></textarea>
        <button class="btn add" onclick="addCart('${p.id}')">Agregar</button>
      </div>
    </article>
  `).join('') || '<p style="grid-column:1/-1;color:#9a9678">No hay productos con ese filtro.</p>';
}

function addCart(id){
  const noteEl = document.getElementById('note-'+id);
  const note = (noteEl && noteEl.value || '').trim();
  const found = cart.find(i => i.id===id && (i.note||'')===note);
  if(found) found.qty += 1;
  else cart.push({id, qty:1, note, line: Date.now()});
  persistCart(); renderBadge();
  if(noteEl) noteEl.value = '';
}

function changeQty(line, d){
  const it = cart.find(i=>String(i.line)===String(line));
  if(!it) return;
  it.qty += d;
  if(it.qty<=0) cart = cart.filter(i=>String(i.line)!==String(line));
  persistCart(); renderCart(); renderBadge();
}

function openDrawer(mode){
  document.getElementById('drawer').classList.add('open');
  document.getElementById('cartView').style.display = mode==='cart'?'block':'none';
  document.getElementById('userView').style.display = mode==='user'?'block':'none';
  document.getElementById('drawerTitle').textContent = mode==='cart'?'Carrito':'Mis datos';
  if(mode==='cart') renderCart();
}
function closeDrawer(){ document.getElementById('drawer').classList.remove('open'); }
document.getElementById('drawer').addEventListener('click', e => { if(e.target.id==='drawer') closeDrawer(); });

function renderCart(){
  if(!cart.length){
    document.getElementById('cartView').innerHTML = '<p style="color:#9a9678">El carrito está vacío.</p>';
    return;
  }
  let total=0;
  const rows = cart.map(it => {
    const p = product(it.id); if(!p) return '';
    const sub = p.price * it.qty; total += sub;
    return `<div class="cart-item">
      <img src="${p.img}" alt="">
      <div style="flex:1">
        <div style="font-size:13px">${esc(p.name)}</div>
        <div style="color:var(--gold);font-weight:700">${money(p.price)}</div>
        ${it.note ? `<div class="obs">Obs: ${esc(it.note)}</div>` : ''}
        <div class="qty">
          <button onclick="changeQty('${it.line}',-1)">−</button>
          <span>${it.qty}</span>
          <button onclick="changeQty('${it.line}',1)">+</button>
        </div>
      </div>
      <div>${money(sub)}</div>
    </div>`;
  }).join('');
  document.getElementById('cartView').innerHTML = rows + `
    <div class="total-row"><span>Total</span><span>${money(total)}</span></div>
    <button class="btn btn-ghost btn-full" onclick="openDrawer('user')">Cargar / revisar mis datos</button>
    <button class="btn btn-full" onclick="sendWhatsApp()">Enviar pedido por WhatsApp</button>
  `;
}

function fillUser(){
  document.getElementById('u_name').value = user.name||'';
  document.getElementById('u_phone').value = user.phone||'';
  document.getElementById('u_email').value = user.email||'';
  document.getElementById('u_addr').value = user.addr||'';
}
function saveUser(){
  user = {
    name: document.getElementById('u_name').value.trim(),
    phone: document.getElementById('u_phone').value.trim(),
    email: document.getElementById('u_email').value.trim(),
    addr: document.getElementById('u_addr').value.trim()
  };
  localStorage.setItem(USER_KEY, JSON.stringify(user));
  const ok=document.getElementById('userOk'); ok.style.display='block';
  setTimeout(()=>ok.style.display='none',1600);
}

function sendWhatsApp(){
  if(!cart.length){ alert('El carrito está vacío'); return; }
  user = {
    name: document.getElementById('u_name').value.trim() || user.name || '',
    phone: document.getElementById('u_phone').value.trim() || user.phone || '',
    email: document.getElementById('u_email').value.trim() || user.email || '',
    addr: document.getElementById('u_addr').value.trim() || user.addr || ''
  };
  if(!user.name || !user.phone){
    openDrawer('user');
    alert('Completá al menos nombre y WhatsApp para enviar el pedido.');
    return;
  }
  localStorage.setItem(USER_KEY, JSON.stringify(user));
  let total=0;
  const lines = cart.map(it => {
    const p = product(it.id); if(!p) return '';
    const sub = p.price*it.qty; total += sub;
    const obs = it.note ? ` | Obs: ${it.note}` : '';
    return `• ${it.qty} x ${p.name} (${p.id}) — ${money(sub)}${obs}`;
  }).join('\n');
  const load = cart.map(it => `${it.id}*${it.qty}`).join(',');
  const msg = `*BONVIVANT ELECTRO*\n*Nuevo pedido*\n\n*Cliente:* ${user.name}\n*WhatsApp:* ${user.phone}\n*Email:* ${user.email||'-'}\n*Dirección:* ${user.addr||'-'}\n\n*Detalle:*\n${lines}\n\n*Total:* ${money(total)}\n\n*Cargar:* BVLOAD ${load}`;
  window.open(`https://wa.me/${WA}?text=${encodeURIComponent(msg)}`,'_blank');
}
</script>
